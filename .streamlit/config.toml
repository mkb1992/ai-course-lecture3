[theme]
primaryColor = "#C9973A"
backgroundColor = "#F2F5FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B1F3A"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap"

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = true
